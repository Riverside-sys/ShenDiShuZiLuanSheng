<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f9fcff"/><stop offset="100%" stop-color="#edf6ff"/></linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1f5fd6"/><stop offset="100%" stop-color="#16b8a8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#214c70" flood-opacity="0.14"/></filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#1f5fd6"/></marker>
    <style>
      .title{font:700 34px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#153a5a}
      .sub{font:400 17px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#55728d}
      .head{font:700 20px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#173b5b}
      .txt{font:400 15px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#395873}
      .white{font:700 17px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#ffffff}
      .note{font:700 17px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#1f5fd6}
      .small{font:400 13px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#55728d}
      .line{stroke:#1f5fd6;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1200" height="920" rx="26" fill="url(#bg)"/>
  <text x="600" y="56" text-anchor="middle" class="title">潘一东矿区数字孪生场景开发框架</text>
  <text x="600" y="86" text-anchor="middle" class="sub">基于 Vue Router 的主场景与子场景组织：主矿区 Cesium 场景承载总览，子路由承载专题巷道场景</text>
<rect x="420" y="116" width="360" height="68" rx="18" fill="url(#primary)" stroke="#1f5fd6" filter="url(#shadow)"/>
<text x="600.0" y="150" text-anchor="middle" class="white">访问入口：#/panyidong</text>
<text x="600.0" y="180" text-anchor="middle" class="white">路由名：panyidong，标题：潘一东矿区</text>
<path class="line" d="M600 184 L600 222"/>
<rect x="300" y="222" width="600" height="86" rx="18" fill="#ffffff" stroke="#b9d6f2" filter="url(#shadow)"/>
<text x="600.0" y="256" text-anchor="middle" class="head">路由模块：PanyidongItem</text>
<text x="600.0" y="286" text-anchor="middle" class="txt">/panyidong → Views/panyidong/index.vue；children → router-view</text>
<path class="line" d="M600 308 L600 348"/>
<rect x="230" y="348" width="740" height="122" rx="18" fill="#ffffff" stroke="#b9d6f2" filter="url(#shadow)"/>
<text x="600.0" y="382" text-anchor="middle" class="head">主场景：潘一东矿区总览</text>
<text x="600.0" y="412" text-anchor="middle" class="txt">initCesiumScene 加载潘一东巷道 GLB 模型，作为矿区底层三维背景</text>
<text x="600.0" y="436" text-anchor="middle" class="txt">左右信息面板、顶部工具栏、底部控制栏叠加在 1920×1080 缩放 UI 层</text>
<path class="line" d="M600 470 L600 510"/>
<rect x="130" y="510" width="280" height="132" rx="18" fill="#eef5ff" stroke="#9ec8ef" filter="url(#shadow)"/>
<text x="270.0" y="544" text-anchor="middle" class="head">场景交互能力</text>
<text x="270.0" y="574" text-anchor="middle" class="txt">Toolbar：区域定位 flyTo</text>
<text x="270.0" y="598" text-anchor="middle" class="txt">Footer：重置视角/启动漫游</text>
<text x="270.0" y="622" text-anchor="middle" class="txt">WASD/QE/Shift：键盘漫游</text>
<rect x="460" y="510" width="280" height="132" rx="18" fill="#f0fff8" stroke="#9ed9bd" filter="url(#shadow)"/>
<text x="600.0" y="544" text-anchor="middle" class="head">主子场景切换</text>
<text x="600.0" y="574" text-anchor="middle" class="txt">showSubscene 监听 route.name</text>
<text x="600.0" y="598" text-anchor="middle" class="txt">主场景 v-show 隐藏</text>
<text x="600.0" y="622" text-anchor="middle" class="txt">router-view 渲染子场景</text>
<rect x="790" y="510" width="280" height="132" rx="18" fill="#fff8eb" stroke="#efcc82" filter="url(#shadow)"/>
<text x="930.0" y="544" text-anchor="middle" class="head">资源组织</text>
<text x="930.0" y="574" text-anchor="middle" class="txt">data/index.ts 统一导出 URL</text>
<text x="930.0" y="598" text-anchor="middle" class="txt">GLB、PLY、视频按场景维护</text>
<text x="930.0" y="622" text-anchor="middle" class="txt">Vite ?url 管理静态资产</text>
<path class="line" d="M270 642 C270 690 420 690 420 724"/>
<path class="line" d="M600 642 L600 724"/>
<path class="line" d="M930 642 C930 690 780 690 780 724"/>
<rect x="180" y="724" width="430" height="120" rx="18" fill="#ffffff" stroke="#b9d6f2" filter="url(#shadow)"/>
<text x="395.0" y="758" text-anchor="middle" class="head">子场景一：高斯泼溅巷道</text>
<text x="395.0" y="788" text-anchor="middle" class="txt">subscenes/mines_roadway_gsplat</text>
<text x="395.0" y="812" text-anchor="middle" class="txt">GaussianSplats Viewer 加载 PLY，支持渐进加载与兼容模式</text>
<rect x="650" y="724" width="430" height="120" rx="18" fill="#ffffff" stroke="#b9d6f2" filter="url(#shadow)"/>
<text x="865.0" y="758" text-anchor="middle" class="head">子场景二：卧牛山巷道</text>
<text x="865.0" y="788" text-anchor="middle" class="txt">subscenes/woniushan_roadway</text>
<text x="865.0" y="812" text-anchor="middle" class="txt">Three.js 加载合并与 11 段 PLY，支撑分段定位与漫游巡检</text>
</svg>
