<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f9fcff"/><stop offset="100%" stop-color="#edf6ff"/></linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1f5fd6"/><stop offset="100%" stop-color="#16b8a8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#214c70" flood-opacity="0.14"/></filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#1f5fd6"/></marker>
    <style>
      .title{font:700 34px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#153a5a}
      .sub{font:400 17px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#55728d}
      .head{font:700 20px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#173b5b}
      .txt{font:400 15px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#395873}
      .white{font:700 17px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#ffffff}
      .note{font:700 17px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#1f5fd6}
      .small{font:400 13px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#55728d}
      .line{stroke:#1f5fd6;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1200" height="900" rx="26" fill="url(#bg)"/>
  <text x="600" y="56" text-anchor="middle" class="title">卧牛山巷道点云降采样技术路线</text>
  <text x="600" y="86" text-anchor="middle" class="sub">层级式泊松圆盘采样 HPDS：先构建稀疏骨架，再进行精细填充，兼顾均匀性与计算效率</text>
<rect x="420" y="118" width="360" height="70" rx="18" fill="url(#primary)" stroke="#1f5fd6" filter="url(#shadow)"/>
<text x="600.0" y="152" text-anchor="middle" class="white">输入：原始巷道点云 M</text>
<text x="600.0" y="182" text-anchor="middle" class="white">坐标、颜色、强度等属性进入采样流程</text>
<path class="line" d="M600 188 L600 228"/>
<rect x="390" y="228" width="420" height="92" rx="18" fill="#ffffff" stroke="#b9d6f2" filter="url(#shadow)"/>
<text x="600.0" y="262" text-anchor="middle" class="head">预处理与参数设定</text>
<text x="600.0" y="292" text-anchor="middle" class="txt">确定目标点数 N、骨架规模 Nc、采样半径 rmax</text>
<path class="line" d="M600 320 L600 360"/>
<rect x="160" y="360" width="360" height="122" rx="18" fill="#eef5ff" stroke="#9ec8ef" filter="url(#shadow)"/>
<text x="340.0" y="394" text-anchor="middle" class="head">第一阶段：骨架构建</text>
<text x="340.0" y="424" text-anchor="middle" class="txt">计算邻域拥挤权重 Wi</text>
<text x="340.0" y="448" text-anchor="middle" class="txt">迭代剔除最拥挤样本</text>
<text x="340.0" y="472" text-anchor="middle" class="txt">得到稀疏骨架点集 S1</text>
<rect x="680" y="360" width="360" height="122" rx="18" fill="#f0fff8" stroke="#9ed9bd" filter="url(#shadow)"/>
<text x="860.0" y="394" text-anchor="middle" class="head">空间约束：禁止区域</text>
<text x="860.0" y="424" text-anchor="middle" class="txt">以 S1 为中心构建 Rex</text>
<text x="860.0" y="448" text-anchor="middle" class="txt">剔除过近候选点</text>
<text x="860.0" y="472" text-anchor="middle" class="txt">形成精细候选集 Mf</text>
<path class="line" d="M600 320 C600 342 340 342 340 360"/>
<path class="line" d="M600 320 C600 342 860 342 860 360"/>
<path class="line" d="M340 482 C340 530 600 530 600 560"/>
<path class="line" d="M860 482 C860 530 600 530 600 560"/>
<rect x="390" y="560" width="420" height="106" rx="18" fill="#ffffff" stroke="#b9d6f2" filter="url(#shadow)"/>
<text x="600.0" y="594" text-anchor="middle" class="head">第二阶段：精细填充</text>
<text x="600.0" y="624" text-anchor="middle" class="txt">在 Mf 内二次加权样本消除，得到 S2</text>
<text x="600.0" y="648" text-anchor="middle" class="txt">合并 S = S1 ∪ S2，形成蓝噪声采样结果</text>
<path class="line" d="M600 666 L600 710"/>
<rect x="300" y="710" width="600" height="86" rx="18" fill="url(#primary)" stroke="#1f5fd6" filter="url(#shadow)"/>
<text x="600.0" y="744" text-anchor="middle" class="white">输出：高质量巷道点云子集</text>
<text x="600.0" y="774" text-anchor="middle" class="white">空间均匀、低频噪声低、轮廓连续，可用于 LOD 瓦片生成</text>
<rect x="80" y="612" width="230" height="108" rx="18" fill="#fff8eb" stroke="#efcc82" filter="url(#shadow)"/>
<text x="195.0" y="646" text-anchor="middle" class="head">质量收益</text>
<text x="195.0" y="676" text-anchor="middle" class="txt">最小距离约束</text>
<text x="195.0" y="700" text-anchor="middle" class="txt">抑制点簇与空洞</text>
<text x="195.0" y="724" text-anchor="middle" class="txt">呈现蓝噪声频谱</text>
<rect x="890" y="612" width="230" height="108" rx="18" fill="#eefaf1" stroke="#86d39c" filter="url(#shadow)"/>
<text x="1005.0" y="646" text-anchor="middle" class="head">效率收益</text>
<text x="1005.0" y="676" text-anchor="middle" class="txt">分治缩小计算范围</text>
<text x="1005.0" y="700" text-anchor="middle" class="txt">提前排除禁止区域</text>
<text x="1005.0" y="724" text-anchor="middle" class="txt">平均效率提升 53.87%</text>
</svg>
