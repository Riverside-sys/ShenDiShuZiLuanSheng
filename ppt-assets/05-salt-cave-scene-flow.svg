<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f9fcff"/><stop offset="100%" stop-color="#edf6ff"/></linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1f5fd6"/><stop offset="100%" stop-color="#16b8a8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#214c70" flood-opacity="0.14"/></filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#1f5fd6"/></marker>
    <style>
      .title{font:700 34px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#153a5a}
      .sub{font:400 17px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#55728d}
      .head{font:700 20px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#173b5b}
      .txt{font:400 15px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#395873}
      .white{font:700 17px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#ffffff}
      .note{font:700 17px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#1f5fd6}
      .small{font:400 13px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#55728d}
      .line{stroke:#1f5fd6;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1200" height="940" rx="26" fill="url(#bg)"/>
  <text x="600" y="56" text-anchor="middle" class="title">盐穴场景构建与单体分析流程</text>
  <text x="600" y="86" text-anchor="middle" class="sub">总览场景负责盐穴群展示与入口触发，单体子场景负责 PLY 模型、洞腔属性与稳定性分析展示</text>
<rect x="430" y="118" width="340" height="68" rx="18" fill="url(#primary)" stroke="#1f5fd6" filter="url(#shadow)"/>
<text x="600.0" y="152" text-anchor="middle" class="white">访问入口：#/saltCave</text>
<text x="600.0" y="182" text-anchor="middle" class="white">路由名：saltCave，标题：盐穴</text>
<path class="line" d="M600 186 L600 224"/>
<rect x="310" y="224" width="580" height="92" rx="18" fill="#ffffff" stroke="#b9d6f2" filter="url(#shadow)"/>
<text x="600.0" y="258" text-anchor="middle" class="head">路由模块：SaltCaveItem</text>
<text x="600.0" y="288" text-anchor="middle" class="txt">/saltCave → Views/saltCave/index.vue；子路由 salt_cave_single</text>
<path class="line" d="M600 316 L600 356"/>
<rect x="220" y="356" width="760" height="126" rx="18" fill="#ffffff" stroke="#b9d6f2" filter="url(#shadow)"/>
<text x="600.0" y="390" text-anchor="middle" class="head">盐穴总览场景</text>
<text x="600.0" y="420" text-anchor="middle" class="txt">Three.js 初始化透明 WebGL 画布，GLTFLoader 加载盐穴三维模型</text>
<text x="600.0" y="444" text-anchor="middle" class="txt">OrbitControls + Tween 实现总览、巡检、A/B 腔定位与平滑飞行</text>
<text x="600.0" y="468" text-anchor="middle" class="txt">Raycaster 点击模型生成标签，跳转“进入盐穴场景”</text>
<path class="line" d="M600 482 L600 522"/>
<rect x="360" y="522" width="480" height="86" rx="18" fill="url(#primary)" stroke="#1f5fd6" filter="url(#shadow)"/>
<text x="600.0" y="556" text-anchor="middle" class="white">子场景入口：#/saltCave/subscenes/salt_cave_single</text>
<text x="600.0" y="586" text-anchor="middle" class="white">SaltCaveSingle.vue 承载盐穴单体与关联模型分析</text>
<path class="line" d="M600 608 L600 648"/>
<rect x="120" y="648" width="300" height="132" rx="18" fill="#eef5ff" stroke="#9ec8ef" filter="url(#shadow)"/>
<text x="270.0" y="682" text-anchor="middle" class="head">模型加载与切换</text>
<text x="270.0" y="712" text-anchor="middle" class="txt">PLYLoader 加载单体盐穴</text>
<text x="270.0" y="736" text-anchor="middle" class="txt">切换至多盐穴关联模型</text>
<text x="270.0" y="760" text-anchor="middle" class="txt">释放旧 Mesh 防止资源残留</text>
<rect x="450" y="648" width="300" height="132" rx="18" fill="#f0fff8" stroke="#9ed9bd" filter="url(#shadow)"/>
<text x="600.0" y="682" text-anchor="middle" class="head">洞腔定位与属性</text>
<text x="600.0" y="712" text-anchor="middle" class="txt">丰储 1 号腔、瑞盐 3 号腔、通源 5 号腔</text>
<text x="600.0" y="736" text-anchor="middle" class="txt">相机飞行定位到预设姿态</text>
<text x="600.0" y="760" text-anchor="middle" class="txt">展示深度、容积、承压、蠕变等指标</text>
<rect x="780" y="648" width="300" height="132" rx="18" fill="#fff8eb" stroke="#efcc82" filter="url(#shadow)"/>
<text x="930.0" y="682" text-anchor="middle" class="head">专题监测面板</text>
<text x="930.0" y="712" text-anchor="middle" class="txt">基础详情与运行监测</text>
<text x="930.0" y="736" text-anchor="middle" class="txt">体积变化、蠕变趋势</text>
<text x="930.0" y="760" text-anchor="middle" class="txt">稳定性状态评估</text>
<path class="line" d="M270 780 C270 818 600 818 600 850"/>
<path class="line" d="M600 780 L600 850"/>
<path class="line" d="M930 780 C930 818 600 818 600 850"/>
<rect x="350" y="850" width="500" height="58" rx="18" fill="url(#primary)" stroke="#1f5fd6" filter="url(#shadow)"/>
<text x="600.0" y="884" text-anchor="middle" class="white">输出：盐穴群总览、单腔分析、关联关系展示的一体化数字孪生场景</text>
</svg>
