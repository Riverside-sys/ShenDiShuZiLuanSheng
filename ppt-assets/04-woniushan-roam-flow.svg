<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f9fcff"/><stop offset="100%" stop-color="#edf6ff"/></linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1f5fd6"/><stop offset="100%" stop-color="#16b8a8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#214c70" flood-opacity="0.14"/></filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#1f5fd6"/></marker>
    <style>
      .title{font:700 34px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#153a5a}
      .sub{font:400 17px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#55728d}
      .head{font:700 20px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#173b5b}
      .txt{font:400 15px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#395873}
      .white{font:700 17px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#ffffff}
      .note{font:700 17px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#1f5fd6}
      .small{font:400 13px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#55728d}
      .line{stroke:#1f5fd6;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1200" height="940" rx="26" fill="url(#bg)"/>
  <text x="600" y="56" text-anchor="middle" class="title">卧牛山巷道内部行走与自动巡检流程</text>
  <text x="600" y="86" text-anchor="middle" class="sub">Three.js 点云场景通过巷道中线提取，把总览、进入巷道、自由漫游和自动巡检连接成统一交互链路</text>
<rect x="390" y="118" width="420" height="70" rx="18" fill="url(#primary)" stroke="#1f5fd6" filter="url(#shadow)"/>
<text x="600.0" y="152" text-anchor="middle" class="white">子路由：#/panyidong/subscenes/woniushan_roadway</text>
<text x="600.0" y="182" text-anchor="middle" class="white">组件：WoniushanRoadway.vue</text>
<path class="line" d="M600 188 L600 226"/>
<rect x="320" y="226" width="560" height="92" rx="18" fill="#ffffff" stroke="#b9d6f2" filter="url(#shadow)"/>
<text x="600.0" y="260" text-anchor="middle" class="head">场景初始化</text>
<text x="600.0" y="290" text-anchor="middle" class="txt">WebGLRenderer + PerspectiveCamera + OrbitControls + 环境光/方向光 + 网格辅助线</text>
<path class="line" d="M600 318 L600 358"/>
<rect x="160" y="358" width="370" height="122" rx="18" fill="#eef5ff" stroke="#9ec8ef" filter="url(#shadow)"/>
<text x="345.0" y="392" text-anchor="middle" class="head">加载合并点云</text>
<text x="345.0" y="422" text-anchor="middle" class="txt">PLYLoader 读取 Merged mesh.ply</text>
<text x="345.0" y="446" text-anchor="middle" class="txt">计算包围盒、中心点、尺寸</text>
<text x="345.0" y="470" text-anchor="middle" class="txt">自动设置初始相机位置</text>
<rect x="670" y="358" width="370" height="122" rx="18" fill="#f0fff8" stroke="#9ed9bd" filter="url(#shadow)"/>
<text x="855.0" y="392" text-anchor="middle" class="head">加载分段点云</text>
<text x="855.0" y="422" text-anchor="middle" class="txt">按需加载 01-11 段 PLY</text>
<text x="855.0" y="446" text-anchor="middle" class="txt">缓存段对象与状态</text>
<text x="855.0" y="470" text-anchor="middle" class="txt">统计点数、颜色、质量评分</text>
<path class="line" d="M345 480 C345 520 600 520 600 552"/>
<path class="line" d="M855 480 C855 520 600 520 600 552"/>
<rect x="300" y="552" width="600" height="132" rx="18" fill="#ffffff" stroke="#b9d6f2" filter="url(#shadow)"/>
<text x="600.0" y="586" text-anchor="middle" class="head">巷道中线提取</text>
<text x="600.0" y="616" text-anchor="middle" class="txt">根据包围盒尺寸选择最长轴 x / y / z，沿长轴切分 80 个切片</text>
<text x="600.0" y="640" text-anchor="middle" class="txt">统计每个切片点云质心，构建 CatmullRomCurve3 作为行走中心线</text>
<text x="600.0" y="664" text-anchor="middle" class="txt">中心线用于进入巷道、自动巡检路径和分段定位视角</text>
<path class="line" d="M600 684 L600 724"/>
<rect x="95" y="724" width="230" height="114" rx="18" fill="#ffffff" stroke="#b9d6f2" filter="url(#shadow)"/>
<text x="210.0" y="758" text-anchor="middle" class="head">总览模式</text>
<text x="210.0" y="788" text-anchor="middle" class="txt">OrbitControls 观察</text>
<text x="210.0" y="812" text-anchor="middle" class="txt">分段定位与重置视角</text>
<rect x="365" y="724" width="230" height="114" rx="18" fill="#ffffff" stroke="#b9d6f2" filter="url(#shadow)"/>
<text x="480.0" y="758" text-anchor="middle" class="head">进入巷道</text>
<text x="480.0" y="788" text-anchor="middle" class="txt">取中心线 t=0.02 位置</text>
<text x="480.0" y="812" text-anchor="middle" class="txt">相机看向前方切点</text>
<rect x="635" y="724" width="230" height="114" rx="18" fill="#ffffff" stroke="#b9d6f2" filter="url(#shadow)"/>
<text x="750.0" y="758" text-anchor="middle" class="head">自由漫游</text>
<text x="750.0" y="788" text-anchor="middle" class="txt">WASD 平移，QE 升降</text>
<text x="750.0" y="812" text-anchor="middle" class="txt">鼠标/指针锁定转向</text>
<rect x="905" y="724" width="230" height="114" rx="18" fill="#ffffff" stroke="#b9d6f2" filter="url(#shadow)"/>
<text x="1020.0" y="758" text-anchor="middle" class="head">自动巡检</text>
<text x="1020.0" y="788" text-anchor="middle" class="txt">按中心线生成 80 步路径</text>
<text x="1020.0" y="812" text-anchor="middle" class="txt">逐帧更新相机与进度</text>
<text x="600" y="888" text-anchor="middle" class="txt">输出效果：点云分段可定位、巡检进度可展示、环境/设备/告警面板与三维漫游联动</text>
</svg>
