<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f9fcff"/><stop offset="100%" stop-color="#edf6ff"/></linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1f5fd6"/><stop offset="100%" stop-color="#16b8a8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#214c70" flood-opacity="0.14"/></filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#1f5fd6"/></marker>
    <style>
      .title{font:700 34px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#153a5a}
      .sub{font:400 17px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#55728d}
      .head{font:700 20px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#173b5b}
      .txt{font:400 15px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#395873}
      .white{font:700 17px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#ffffff}
      .note{font:700 17px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#1f5fd6}
      .small{font:400 13px 'Microsoft YaHei','PingFang SC',Arial,sans-serif;fill:#55728d}
      .line{stroke:#1f5fd6;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1200" height="920" rx="26" fill="url(#bg)"/>
  <text x="600" y="56" text-anchor="middle" class="title">卧牛山巷道点云 LOD 构建与动态调度框架</text>
  <text x="600" y="86" text-anchor="middle" class="sub">DO-Octree 紧凑索引 + HPDS 层级采样 + 3D Tiles 瓦片化 + Cesium 动态调度</text>
<rect x="420" y="118" width="360" height="66" rx="18" fill="url(#primary)" stroke="#1f5fd6" filter="url(#shadow)"/>
<text x="600.0" y="152" text-anchor="middle" class="white">输入：大规模巷道原始点云 P</text>
<path class="line" d="M600 184 L600 220"/>
<rect x="250" y="220" width="700" height="122" rx="18" fill="#ffffff" stroke="#b9d6f2" filter="url(#shadow)"/>
<text x="600.0" y="254" text-anchor="middle" class="head">方向自适应八叉树 DO-Octree</text>
<text x="600.0" y="284" text-anchor="middle" class="txt">PCA 计算方向包围盒 OBB，依据线性度与夹角判断方向继承或重算</text>
<text x="600.0" y="308" text-anchor="middle" class="txt">递归剖分后自底向上合并稀疏叶节点，减少层级拓扑冗余</text>
<path class="line" d="M600 342 L600 382"/>
<rect x="115" y="382" width="300" height="130" rx="18" fill="#eef5ff" stroke="#9ec8ef" filter="url(#shadow)"/>
<text x="265.0" y="416" text-anchor="middle" class="head">索引输出</text>
<text x="265.0" y="446" text-anchor="middle" class="txt">层级节点拓扑</text>
<text x="265.0" y="470" text-anchor="middle" class="txt">方向包围盒</text>
<text x="265.0" y="494" text-anchor="middle" class="txt">节点点集与空间范围</text>
<rect x="450" y="382" width="300" height="130" rx="18" fill="#f0fff8" stroke="#9ed9bd" filter="url(#shadow)"/>
<text x="600.0" y="416" text-anchor="middle" class="head">层级采样</text>
<text x="600.0" y="446" text-anchor="middle" class="txt">节点内执行 HPDS</text>
<text x="600.0" y="470" text-anchor="middle" class="txt">低层保留细节</text>
<text x="600.0" y="494" text-anchor="middle" class="txt">高层形成概览子集</text>
<rect x="785" y="382" width="300" height="130" rx="18" fill="#fff8eb" stroke="#efcc82" filter="url(#shadow)"/>
<text x="935.0" y="416" text-anchor="middle" class="head">数据编码</text>
<text x="935.0" y="446" text-anchor="middle" class="txt">按层级生成瓦片</text>
<text x="935.0" y="470" text-anchor="middle" class="txt">输出 .pnts 与 tileset</text>
<text x="935.0" y="494" text-anchor="middle" class="txt">适配 Web 三维调度</text>
<path class="line" d="M265 512 C265 550 600 550 600 590"/>
<path class="line" d="M600 512 L600 590"/>
<path class="line" d="M935 512 C935 550 600 550 600 590"/>
<rect x="300" y="590" width="600" height="112" rx="18" fill="#ffffff" stroke="#b9d6f2" filter="url(#shadow)"/>
<text x="600.0" y="624" text-anchor="middle" class="head">LOD 动态调度策略</text>
<text x="600.0" y="654" text-anchor="middle" class="txt">视锥体剔除 VFC：剔除视域外瓦片，减少无效渲染负载</text>
<text x="600.0" y="678" text-anchor="middle" class="txt">屏幕空间误差 SSE：根据视距、分辨率和误差阈值选择细节层级</text>
<path class="line" d="M600 702 L600 742"/>
<rect x="360" y="742" width="480" height="76" rx="18" fill="url(#primary)" stroke="#1f5fd6" filter="url(#shadow)"/>
<text x="600.0" y="776" text-anchor="middle" class="white">输出：远粗近细的多分辨率巷道可视化</text>
<text x="600.0" y="806" text-anchor="middle" class="white">保证视觉连续性，降低大规模点云实时渲染压力</text>
<rect x="92" y="742" width="210" height="104" rx="18" fill="#ffffff" stroke="#c8ddec" filter="url(#shadow)"/>
<text x="197.0" y="776" text-anchor="middle" class="head">索引效果</text>
<text x="197.0" y="806" text-anchor="middle" class="txt">节点占用率平均提升</text>
<text x="197.0" y="830" text-anchor="middle" class="txt">18.48%</text>
<rect x="898" y="742" width="210" height="104" rx="18" fill="#ffffff" stroke="#c8ddec" filter="url(#shadow)"/>
<text x="1003.0" y="776" text-anchor="middle" class="head">采样效果</text>
<text x="1003.0" y="806" text-anchor="middle" class="txt">层级采样效率平均提升</text>
<text x="1003.0" y="830" text-anchor="middle" class="txt">53.87%</text>
</svg>
